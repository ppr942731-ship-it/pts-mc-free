<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PTS MC Free 🎮</title>
  <link rel="stylesheet" href="style.css">
  <!-- SkinView3D Library -->
  <script src="https://cdn.jsdelivr.net/npm/skinview3d@3.0.0/bundles/skinview3d.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>🎮 PTS MC Free</h1>
    <p class="subtitle">Pilih Pose → Upload Skin → Download Hasil!</p>

    <!-- Hasil 3D -->
    <div class="canvas-wrapper">
      <canvas id="skinCanvas"></canvas>
    </div>

    <!-- Pilih Pose -->
    <div class="section">
      <h3>📸 Pilih Pose</h3>
      <div id="poseList" class="pose-grid"></div>
    </div>

    <!-- Upload Skin -->
    <div class="section">
      <h3>👤 Upload Skin Minecraft</h3>
      <input type="file" id="skinInput" accept=".png" class="file-input">
      <p id="skinStatus">Belum ada skin dipilih</p>
    </div>

    <!-- Tombol Download -->
    <button id="downloadBtn" class="download-btn" disabled>💾 Download Gambar</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
